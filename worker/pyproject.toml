[project]
name = "worker"
version = "0.1.0"
description = "Video processing: TrackNetV3 shuttle tracking + rule-based rally detection"
requires-python = ">=3.14,<4.0"
# Also needs the ffmpeg binary on PATH (brew install ffmpeg).
dependencies = [
    "torch>=2.9",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "tqdm>=4.66",
    "parse>=1.20",
    "pillow>=11.0",
    "scikit-learn==1.9.1",
]

[tool.uv]
package = false  # scripts, not an installable package
